name: docdoc_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1


environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.0

  # State Management & Dependency Injection
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1

  # Networking & Data Handling
  dio: ^5.4.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1
  json_annotation: ^4.9.0

  # Localization & Utilities
  intl: ^0.20.2
  easy_localization: ^3.0.7
  freezed_annotation: ^3.1.0
  lottie: ^3.3.3
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation Tools (Pinned to compatible versions)
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.8
  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_Regular.ttf
          weight: 400
          
        - asset: assets/fonts/inter/Inter_Medium.ttf
          weight: 500

        - asset: assets/fonts/inter/Inter_SemiBold.ttf
          weight: 600

        - asset: assets/fonts/inter/Inter_Bold.ttf
          weight: 700

